apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mysql.fullname" . }}-config
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
  MYSQL_DATABASE: bankdb
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql-svc:3306/bankdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  SPRING_DATASOURCE_USERNAME: root
